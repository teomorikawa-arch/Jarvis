<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Henkilökohtainen avustaja.">
<meta name="theme-color" content="#010B15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="is-standby">

<!-- Ainoa näkymä: pelkkä orbi. Kosketus orbia puhuu Jarvisille;
     jos puheentunnistus ei ole tuettu, kysytään tekstinä. -->
<div class="standby" id="standby" role="button" tabindex="0" aria-label="Puhu Jarvisille">
  <canvas class="standby__dust" id="dust" aria-hidden="true"></canvas>

  <button class="voice standby__voice" id="voiceToggle" type="button" data-on="false" aria-pressed="false" title="Lue vastaukset ääneen">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
      <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
      <path class="voice__wave" d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <p class="standby__mark">J A R V I S</p>

  <div class="orbwrap" id="orbwrap">
    <canvas class="standby__orb" id="heroOrb" data-state="idle" aria-hidden="true"></canvas>
  </div>

  <div class="standby__wave" id="heroWave" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <p class="standby__state" id="heroLabel">VALMIINA</p>
  <p class="standby__hint" id="standbyHint">Kosketa kenttää ja sanele näppäimistön mikrofonilla</p>

  <form class="standby__ask" id="standbyAsk">
    <input class="standby__input" id="standbyInput" type="text" placeholder="Kysy jotain…" autocomplete="off" enterkeyhint="send">
    <button class="standby__send" type="submit" aria-label="Lähetä">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
</div>

<div class="shell">

  <header class="topbar">
    <div class="mark">
      <div class="orb" id="orb" data-state="idle" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <defs>
            <radialGradient id="coreTop" cx="35%" cy="30%" r="75%">
              <stop offset="0%"  stop-color="var(--hud-core)"/>
              <stop offset="55%" stop-color="var(--hud-mid)"/>
              <stop offset="100%" stop-color="var(--hud-deep)"/>
            </radialGradient>
          </defs>
          <circle class="orb__ring orb__ring--outer" cx="60" cy="60" r="54"/>
          <circle class="orb__ring orb__ring--mid"   cx="60" cy="60" r="42"/>
          <g class="orb__ticks" data-ticks="top" data-r="48" data-count="20"></g>
          <circle class="orb__core" cx="60" cy="60" r="20" fill="url(#coreTop)"/>
        </svg>
      </div>
      <span class="mark__text">
        <span class="mark__name">Jarvis</span>
        <span class="mark__sub" id="orbState">valmiina</span>
      </span>
    </div>
    <div class="topbar__right">
      <div class="link" id="link" data-state="checking">
        <span class="link__dot" aria-hidden="true"></span>
        <span class="link__text">tarkistetaan</span>
      </div>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite" aria-label="Keskustelu"></main>

  <form class="composer" id="composer">
    <button class="composer__mic" id="mic" type="button" aria-label="Puhu viesti" data-on="false" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <textarea id="input" class="composer__field" rows="1" placeholder="Kirjoita viesti" autocomplete="off" spellcheck="true"></textarea>
    <button class="composer__send" id="send" type="submit" aria-label="Lähetä">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>

</div>

<script src="app.js"></script>
</body>
</html>
