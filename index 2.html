<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Henkilökohtainen avustaja.">
<meta name="theme-color" content="#EDEBE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="mark">
      <span class="mark__name">Jarvis</span>
      <span class="mark__sub">henkilökohtainen avustaja</span>
    </div>
    <div class="link" id="link" data-state="checking">
      <span class="link__dot" aria-hidden="true"></span>
      <span class="link__text">tarkistetaan</span>
    </div>
  </header>

  <!-- Osajärjestelmärivi: näyttää mitä on kytketty ja mikä vaihe tuo loput -->
  <nav class="rail" aria-label="Osajärjestelmät">
    <article class="mod" data-state="off">
      <span class="mod__dot" aria-hidden="true"></span>
      <h2 class="mod__name">Osakkeet</h2>
      <p class="mod__note">vaihe 3</p>
    </article>
    <article class="mod" data-state="off">
      <span class="mod__dot" aria-hidden="true"></span>
      <h2 class="mod__name">Sähköposti</h2>
      <p class="mod__note">vaihe 4</p>
    </article>
    <article class="mod" data-state="off">
      <span class="mod__dot" aria-hidden="true"></span>
      <h2 class="mod__name">Viestit</h2>
      <p class="mod__note">vaihe 5</p>
    </article>
    <article class="mod" data-state="off">
      <span class="mod__dot" aria-hidden="true"></span>
      <h2 class="mod__name">Puhelut</h2>
      <p class="mod__note">vaihe 5</p>
    </article>
  </nav>

  <main class="log" id="log" aria-live="polite" aria-label="Keskustelu">
    <div class="opening" id="opening">
      <p class="opening__lead">Kysy jotain.</p>
      <p class="opening__body">Vastaukset tulevat omalta palvelimeltasi. Osakkeet, sähköposti, viestit ja puhelut kytketään mukaan myöhemmissä vaiheissa — rivi yllä kertoo, missä mennään.</p>
      <div class="chips">
        <button class="chip" type="button">Mitä osaat tehdä?</button>
        <button class="chip" type="button">Tiivistä päivän uutiset</button>
        <button class="chip" type="button">Auta kirjoittamaan sähköposti</button>
      </div>
    </div>
  </main>

  <form class="composer" id="composer">
    <textarea id="input" class="composer__field" rows="1" placeholder="Kirjoita viesti" autocomplete="off" spellcheck="true"></textarea>
    <button class="composer__send" id="send" type="submit" aria-label="Lähetä">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>

</div>

<script src="app.js"></script>
</body>
</html>
